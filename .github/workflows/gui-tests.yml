name: Desktop GUI Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gui-tests:
    runs-on: ubuntu-24.04

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0

      - name: Install Python dependencies
        run: python -m pip install -r requirements-gui.txt

      - name: Check Python syntax
        run: python -m py_compile gui/main.py tests/test-gui.py

      - name: Test GUI and Bash simulation
        run: python tests/test-gui.py
